<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Setup password</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
	<link rel="stylesheet" href="../../../css/style.css">
	<link rel="stylesheet" href="../../../css/responsive.css">
</head>
<body>
	<section class="auth-section">
		<div class="container-fluid">
			<header class="auth-header">
				<a href="../" class="auth-brand-link">
					<img class="auth-brand-image" src="../../../img/khusa-logos/onekhusa-logo.svg" alt="OneKhusa">
				</a>
			</header>
			<main class="auth-main">
				<div class="auth-form-wrapper">
					<form action="success.html">
							<span class="app-dashboard-stat-icon app-dashboard-stat-icon-primary mb-3 user-account-title-icon" aria-hidden="true"><i data-lucide="key-round"></i></span>
							<h1 class="user-account-title">Set your password</h1>
							<p class="user-account-description">Choose a password to secure your new OneKhusa account.</p>
							<div class="form-group" data-password-strength>
								<label for="password">Password</label>
								<div class="form-group-input-wrapper">
									<i data-lucide="lock"></i>
									<input type="password" class="form-control" id="password" placeholder="Enter your password" autocomplete="new-password" aria-describedby="password-strength-status password-strength-requirements">
								</div>
								<div class="password-strength-meter" role="meter" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" aria-label="Password requirements progress" data-strength="0">
									<span class="password-strength-bar" aria-hidden="true"></span>
									<span class="password-strength-bar" aria-hidden="true"></span>
									<span class="password-strength-bar" aria-hidden="true"></span>
									<span class="password-strength-bar" aria-hidden="true"></span>
									<span class="password-strength-bar" aria-hidden="true"></span>
								</div>
								<p class="password-strength-status" id="password-strength-status" data-strength="0"></p>
								<ul class="password-strength-requirements" id="password-strength-requirements">
									<li data-rule="length"><span class="password-strength-req-icon" aria-hidden="true"><i data-lucide="x" class="password-strength-req-icon-x"></i><i data-lucide="check" class="password-strength-req-icon-check"></i></span> At least 8 characters</li>
									<li data-rule="upper"><span class="password-strength-req-icon" aria-hidden="true"><i data-lucide="x" class="password-strength-req-icon-x"></i><i data-lucide="check" class="password-strength-req-icon-check"></i></span> One uppercase letter</li>
									<li data-rule="lower"><span class="password-strength-req-icon" aria-hidden="true"><i data-lucide="x" class="password-strength-req-icon-x"></i><i data-lucide="check" class="password-strength-req-icon-check"></i></span> One lowercase letter</li>
									<li data-rule="number"><span class="password-strength-req-icon" aria-hidden="true"><i data-lucide="x" class="password-strength-req-icon-x"></i><i data-lucide="check" class="password-strength-req-icon-check"></i></span> One number</li>
									<li data-rule="special"><span class="password-strength-req-icon" aria-hidden="true"><i data-lucide="x" class="password-strength-req-icon-x"></i><i data-lucide="check" class="password-strength-req-icon-check"></i></span> One special character</li>
								</ul>
							</div>
							<div class="form-group" data-password-confirm>
								<label for="confirmPassword">Confirm password</label>
								<div class="form-group-input-wrapper">
									<i data-lucide="lock"></i>
									<input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" aria-describedby="confirm-password-error">
								</div>
								<p class="form-error" id="confirm-password-error" hidden><i data-lucide="x" aria-hidden="true"></i> Passwords do not match</p>
							</div>
							<div class="form-group">
								<button type="submit" class="button button-primary button-md w-100 mb-3">Next</button>
								<a href="verify.html" class="button button-outline button-md w-100"><i data-lucide="move-left"></i> Back</a>
							</div>
					</form>
				</div>
			</main>
			<footer class="auth-footer">
				<p class="auth-footer-text">By continuing, you agree to our terms and privacy policy.</p>
			</footer>
		</div>
	</section>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"
		integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
		integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
		crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
		integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
		crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/lucide@0.561.0/dist/umd/lucide.min.js"></script>
	<script src="../../../js/theme-init.js"></script>
	<script src="../../../js/main.js"></script>
</body>
</html>
